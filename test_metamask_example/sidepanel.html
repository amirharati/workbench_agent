<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fast Panel</title>
</head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#fff;color:#121314">
  <p style="margin:0;padding:10px;background:#037dd6;color:#fff;font-size:12px;font-weight:700;text-align:center">
    FAST PANEL — loaded
  </p>
  <div style="padding:20px">
    <h1 style="font-size:20px;margin:0 0 8px">Welcome</h1>
    <p style="color:#6a737d;font-size:14px;margin:0 0 16px">Minimal HTML, no spinner, no JS required.</p>
    <label style="font-size:12px;color:#6a737d">Password</label><br />
    <input type="password" placeholder="Password" style="width:100%;margin:6px 0 12px;padding:10px;box-sizing:border-box" /><br />
    <button type="button" style="width:100%;padding:12px;border:none;border-radius:999px;background:#037dd6;color:#fff;font-weight:600">Unlock</button>
  </div>
</body>
</html>
